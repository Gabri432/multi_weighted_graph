[project]
name = "multi_weighted_graph"
version = "0.1.0"
description = "A data type representing a graph in which edges can be associated to more weights."
readme = "README.md"
requires-python = ">=3.14.3"
license = {text = "Apache License"}
authors = [
    {name = "Gabriele Gatti", email = "gabrielegatti432@gmail.com"},
]
maintainers = [
  { name="Gabriele Gatti", email="gabrielegatti432@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache License",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Education",
    "Topic :: Scientific/Engineering :: Algorithms and Data Structures"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]