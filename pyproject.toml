[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "multi_weighted_graph"
version = "0.3.0"
description = "A data type representing a graph in which edges can be associated to more weights."
readme = "README.md"
requires-python = ">=3.14.3"
license = {text = "Apache License"}
authors = [
    {name = "Gabriele Gatti", email = "gabrielegatti432@gmail.com"},
]
maintainers = [
  { name="Gabriele Gatti", email="gabrielegatti432@gmail.com" },
]
classifiers = [
    "Operating System :: OS Independent",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Education",
    "Topic :: Education"
]

[project.urls]
Homepage = "https://github.com/Gabri432/multi_weighted_graph"
Issues = "https://github.com/Gabri432/multi_weighted_graph/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
where = ["src/multi_weighted_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]